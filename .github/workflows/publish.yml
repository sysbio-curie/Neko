name: Publish

# Publishing a GitHub release uploads it: pre-releases go to TestPyPI, normal
# releases to PyPI. Uploads use PyPI Trusted Publishing (OIDC), so no API
# token is stored. Each index trusts this file name and its environment:
#   pypi.org      -> sysbio-curie/Neko, publish.yml, environment "pypi"
#   test.pypi.org -> sysbio-curie/Neko, publish.yml, environment "testpypi"

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test.yaml

  build:
    name: Build distributions
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check that the tag matches the package version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package version $version (expected v$version)."
            exit 1
          fi

      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Smoke test the wheel
        working-directory: /tmp
        run: |
          python -m pip install --no-deps "$GITHUB_WORKSPACE"/dist/*.whl
          python -m pip install toml
          python -c 'import os, importlib.metadata as md, neko; expected = os.environ["GITHUB_REF_NAME"][1:]; found = (md.version("nekomata"), neko.__version__); assert found == (expected, expected), found'

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event.release.prerelease
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/nekomata
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: ${{ !github.event.release.prerelease }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nekomata
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
